[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oa-ner-screening"
version = "0.1.0"
description = "Research-only local OA gait screening baseline"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mediapipe==0.10.14",
  "opencv-python>=4.9.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.4.0",
  "joblib>=1.3.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.35.0"]

[tool.setuptools.packages.find]
where = ["src"]
